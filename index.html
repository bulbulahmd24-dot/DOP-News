<script>
let feeds = [
  'https://www.jagonews24.com/rss/rss.xml',
  'https://www.prothomalo.com/feed',
  'https://www.kalerkantho.com/rss.xml'
];
async function load(){
  for(let f of feeds){
    try{
      let url = `https://api.allorigins.win/get?url=${encodeURIComponent(f)}&t=${Date.now()}`;
      let r = await fetch(url);
      let j = await r.json();
      let parser = new DOMParser();
      let xml = parser.parseFromString(j.contents, "text/xml");
      let items = Array.from(xml.querySelectorAll("item")).slice(0,12).map(it=>({
        title: it.querySelector("title")?.textContent || "",
        desc: it.querySelector("description")?.textContent?.slice(0,120) || "",
        link: it.querySelector("link")?.textContent || "#"
      }));
      if(items.length>0){
        document.getElementById('ticker').innerText = items.map(x=>x.title).join(' ••• ');
        document.getElementById('box').innerHTML = items.map(x=>`<div style="border-bottom:1px solid #ddd;padding:18px 0"><h2 style="font-size:22px;font-weight:900;line-height:1.3">${x.title}</h2><p style="color:#555;margin-top:6px">${x.desc}</p></div>`).join('');
        document.getElementById('loading').style.display='none';
        console.log("Loaded from:", f);
        return;
      }
    }catch(e){ console.log("fail", f, e); }
  }
  document.getElementById('box').innerHTML = "সব ফিড ফেইল করেছে, ১ মিনিট পর আবার ট্রাই হবে";
}
load();
setInterval(load, 10*60*1000);
</script>
