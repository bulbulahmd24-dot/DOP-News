<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOP NEWS 24 - World Live</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div class="bg-[#b91c1c] text-white text-center py-4 font-black sticky top-0 z-50">DOP NEWS 24 - WORLD LIVE 🌍 <span id="count" class="bg-white text-red-600 text-xs px-2 py-1 rounded-full ml-2">0 News</span></div>

<div id="news" class="max-w-7xl mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-4"></div>
<div class="text-center py-6"><button onclick="loadMore()" id="moreBtn" class="bg-black text-white px-6 py-2 rounded-full">আরো খবর লোড করুন ↓</button></div>

<script>
let all=[];
async function getNews(){
 const feeds=[
  'http://feeds.bbci.co.uk/news/world/rss.xml',
  'http://feeds.bbci.co.uk/news/technology/rss.xml',
  'http://feeds.bbci.co.uk/news/business/rss.xml',
  'https://rss.cnn.com/rss/edition.rss',
  'http://feeds.reuters.com/reuters/topNews'
 ];
 let merged=[];
 for(let url of feeds){
  try{
   let r=await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
   let d=await r.json();
   if(d.items) merged=merged.concat(d.items);
  }catch(e){}
 }
 all=merged;
 document.getElementById('count').innerText=all.length+'+ Live News';
 render(12);
}
let showing=0;
function render(n){
 showing+=n;
 document.getElementById('news').innerHTML=all.slice(0,showing).map((x,i)=>`
  <div class="bg-white rounded-xl shadow overflow-hidden">
   <img src="${x.enclosure?.link||`https://picsum.photos/seed/${i}ab/600/350`}" class="w-full h-48 object-cover">
   <div class="p-3"><h2 class="font-bold text-[15px] leading-5">${x.title}</h2>
   <p class="text-xs text-gray-500 mt-2">${new Date(x.pubDate).toLocaleString('bn-BD')}</p>
   <a href="${x.link}" target="_blank" class="text-red-600 text-xs font-bold mt-2 inline-block">বিস্তারিত পড়ুন →</a></div>
  </div>`).join('');
}
function loadMore(){render(9);}
getNews();
</script>
</body>
</html>
