<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOP NEWS 24 - AI LIVE</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div class="bg-[#b91c1c] text-white text-center py-4 text-2xl font-bold sticky top-0">DOP NEWS 24 - AI LIVE</div>

<div id="news" class="max-w-2xl mx-auto p-4 grid gap-4"></div>

<script>
const newsList = [
 {id:1, title:"বাংলাদেশে AI প্রযুক্তিতে নতুন যুগের সূচনা", summary:"বাংলাদেশে কৃত্রিম বুদ্ধিমত্তা নিয়ে নতুন উদ্যোগ শুরু হয়েছে। তরুণ উদ্যোক্তারা AI দিয়ে নিউজ সাইট বানাচ্ছে।", cat:"প্রযুক্তি"},
 {id:2, title:"ঢাকায় আজ থেকে শুরু হচ্ছে ডিজিটাল মেলা", summary:"রাজধানীতে ৩ দিনব্যাপী ডিজিটাল উদ্ভাবনী মেলা শুরু হচ্ছে আজ।", cat:"জাতীয়"},
 {id:3, title:"বাংলাদেশ ক্রিকেট দলের দারুণ জয়", summary:"গতকালের ম্যাচে বাংলাদেশ দারুণভাবে জয়লাভ করেছে।", cat:"খেলা"},
 {id:4, title:"আজকের আবহাওয়া: বৃষ্টির সম্ভাবনা", summary:"আবহাওয়া অধিদপ্তর জানিয়েছে আজ দেশের বিভিন্ন স্থানে বৃষ্টি হতে পারে।", cat:"জাতীয়"},
 {id:5, title:"নতুন স্মার্টফোন বাজারে এলো", summary:"দেশের বাজারে নতুন ফিচার সমৃদ্ধ স্মার্টফোন এসেছে কম দামে।", cat:"প্রযুক্তি"}
];
document.getElementById('news').innerHTML = newsList.map(n=>`
 <div class="bg-white rounded-xl shadow p-3">
  <img src="https://picsum.photos/seed/${n.id}123/600/350" class="w-full h-52 object-cover rounded-lg mb-3">
  <h2 class="font-bold text-[18px] leading-6 mb-2">${n.title}</h2>
  <p class="text-gray-600 text-sm mb-3">${n.summary}</p>
  <span class="bg-red-100 text-red-600 text-xs px-3 py-1 rounded-full">${n.cat}</span>
 </div>
`).join('');
</script>
</body>
</html>
