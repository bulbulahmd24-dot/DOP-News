<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOP NEWS 24 - World Live</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
<header class="bg-[#b91c1c] text-white p-3 sticky top-0 z-40 shadow">
 <div class="max-w-7xl mx-auto flex justify-between items-center">
  <h1 class="text-xl md:text-2xl font-black">DOP NEWS 24 - WORLD LIVE 🌍</h1>
  <div class="flex gap-2">
   <button onclick="loadCat('world')" class="bg-white text-red-600 px-3 py-1 rounded-full text-xs font-bold">বিশ্ব</button>
   <button onclick="loadCat('technology')" class="bg-black/20 px-3 py-1 rounded-full text-xs">প্রযুক্তি</button>
   <button onclick="loadCat('sports')" class="bg-black/20 px-3 py-1 rounded-full text-xs">খেলা</button>
  </div>
 </div>
</header>

<div id="status" class="text-center py-2 text-sm text-gray-500">সারা বিশ্ব থেকে লাইভ খবর আনা হচ্ছে...</div>
<div id="news" class="max-w-7xl mx-auto p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>

<div id="modal" class="hidden fixed inset-0 bg-black/70 z-50 p-4 overflow-y-auto">
 <div class="bg-white max-w-3xl mx-auto mt-6 rounded-xl overflow-hidden">
  <div class="p-3 flex justify-between border-b"><b>বিস্তারিত খবর</b><button onclick="closeM()" class="bg-red-600 text-white px-3 rounded">X</button></div>
  <div id="mBody" class="p-4"></div>
 </div>
</div>

<script>
let allNews = [];
const rss = {
 world: 'http://feeds.bbci.co.uk/news/world/rss.xml',
 technology: 'http://feeds.bbci.co.uk/news/technology/rss.xml',
 sports: 'http://feeds.bbci.co.uk/sport/rss.xml'
};

async function loadCat(cat='world'){
 document.getElementById('status').innerText = `${cat} - লাইভ খবর লোড হচ্ছে...`;
 document.getElementById('news').innerHTML = '<p class="col-span-3 text-center py-20">⏳ লোড হচ্ছে...</p>';
 try {
  const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${rss[cat]}`);
  const data = await res.json();
  allNews = data.items;
  document.getElementById('status').innerText = `✅ ${data.feed.title} - ${new Date().toLocaleString('bn-BD')} আপডেট`;
  show();
 } catch(e){
  document.getElementById('status').innerText = '❌ নেট সমস্যা, আবার চেষ্টা করুন';
 }
}

function show(){
 document.getElementById('news').innerHTML = allNews.map((n,i)=>`
  <div onclick="openN(${i})" class="bg-white rounded-xl shadow hover:shadow-xl cursor-pointer overflow-hidden group">
   <img src="${n.enclosure?.link || `https://picsum.photos/seed/${i}world/600/350`}" class="w-full h-48 object-cover group-hover:scale-105 duration-300">
   <div class="p-3">
    <h2 class="font-bold text-[16px] leading-6 mb-2 line-clamp-2">${n.title}</h2>
    <p class="text-gray-600 text-[13px] line-clamp-2">${n.description.replace(/<[^>]*>/g,'').slice(0,100)}...</p>
    <div class="flex justify-between mt-3"><span class="text-xs bg-red-100 text-red-600 px-2 py-1 rounded-full">${n.categories[0]||'বিশ্ব'}</span><span class="text-xs text-gray-400">বিস্তারিত →</span></div>
   </div>
  </div>
 `).join('');
}

function openN(i){
 const n = allNews[i];
 document.getElementById('mBody').innerHTML = `
  <img src="${n.enclosure?.link || ''}" class="w-full h-64 object-cover rounded-lg mb-4">
  <h1 class="text-2xl font-bold mb-3">${n.title}</h1>
  <p class="text-xs text-gray-500 mb-4">${n.pubDate} | Source: BBC News</p>
  <div class="text-gray-700 leading-8 text-[15px]">${n.description}</div>
  <a href="${n.link}" target="_blank" class="block mt-6 bg-[#b91c1c] text-white text-center py-3 rounded-lg font-bold">মূল খবর পড়ুন (BBC)</a>
 `;
 document.getElementById('modal').classList.remove('hidden');
}
function closeM(){document.getElementById('modal').classList.add('hidden');}
loadCat('world');
// প্রতি 5 মিনিটে অটো আপডেট
setInterval(()=>loadCat('world'), 300000);
</script>
</body>
</html>
