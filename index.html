<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOP NEWS 24 - AI LIVE</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100">
<div class="bg-red-600 text-white text-center py-4 text-2xl font-bold">DOP NEWS 24 - AI LIVE</div>
<div id="news-container" class="p-4 grid gap-4 max-w-2xl mx-auto"></div>

<script>
const SUPABASE_URL = "আপনার আগের URL টা এখানে বসান";
const SUPABASE_KEY = "আপনার আগের anon KEY টা এখানে বসান";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadNews(){
  const { data, error } = await supabaseClient.from('news').select('*').order('id', {ascending:false});
  if(error){ console.log(error); return; }
  const container = document.getElementById('news-container');
  container.innerHTML = "";
  data.forEach(n=>{
    container.innerHTML += `
      <div class="bg-white rounded-lg shadow p-3">
        <img src="https://picsum.photos/seed/${n.id}/600/400" class="w-full h-48 object-cover rounded-lg mb-3">
        <h2 class="font-bold text-lg mb-2">${n.title}</h2>
        <p class="text-gray-600 text-sm mb-2">${n.summary}</p>
        <span class="bg-red-100 text-red-600 text-xs px-3 py-1 rounded">${n.category}</span>
      </div>
    `;
  });
}
loadNews();
</script>
</body>
</html>
