<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ডিওপি নিউজ ২৪ | সত্যের সাথে সবসময়</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Serif Bengali',serif;background:#fff}.marquee{white-space:nowrap;animation:marquee 60s linear infinite} @keyframes marquee{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}</style>
</head>
<body>
<!-- Top Date Bar - Prothom Alo Style -->
<div class="border-b text-[13px] py-2 bg-white">
 <div class="max-w-[1280px] mx-auto px-4 flex justify-between">
  <span id="pDate"></span>
  <span>ডিওপি নিউজ ২৪ | ePaper</span>
 </div>
</div>

<!-- Logo Center Like Prothom Alo -->
<div class="text-center py-6 border-b">
 <h1 class="text-5xl font-black tracking-wider">ডিওপি নিউজ ২৪</h1>
 <p class="text-sm mt-1">সত্যের সাথে সবসময়</p>
</div>

<!-- Menu Like Prothom Alo -->
<div class="sticky top-0 z-40 bg-white border-y shadow-sm">
 <div class="max-w-[1280px] mx-auto px-4 flex gap-6 py-3 text-[15px] font-bold overflow-x-auto">
  <a>সর্বশেষ</a><a>জাতীয়</a><a class="text-red-600">বিশ্ব</a><a>রাজনীতি</a><a>খেলা</a><a>বিনোদন</a><a>বাণিজ্য</a><a>প্রযুক্তি</a>
 </div>
</div>

<!-- Breaking Ticker -->
<div class="bg-red-600 text-white flex items-center text-sm">
 <span class="bg-black px-4 py-2 font-bold">ব্রেকিং</span>
 <div class="overflow-hidden flex-1"><div id="ticker" class="marquee py-2"></div></div>
</div>

<main class="max-w-[1280px] mx-auto px-4 py-6">
 <div id="loading" class="text-center py-20">সংবাদ লোড হচ্ছে...</div>
 <div id="error" class="hidden text-red-600"></div>
 <!-- Prothom Alo Layout -->
 <section id="leadSection"></section>
 <section id="gridSection" class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-8 border-t pt-8"></section>
</main>

<!-- Modal -->
<div id="modal" class="hidden fixed inset-0 z-50 bg-black/70 p-4 overflow-y-auto">
 <div class="max-w-3xl mx-auto bg-white">
  <div class="flex justify-between p-4 border-b sticky top-0 bg-white"><b>ডিওপি নিউজ ২৪</b><button onclick="document.getElementById('modal').classList.add('hidden')" class="text-2xl">×</button></div>
  <div id="mBody" class="p-6"></div>
 </div>
</div>

<script>
const FEEDS=["http://feeds.bbci.co.uk/news/world/rss.xml","https://rss.cnn.com/rss/edition.rss","http://feeds.reuters.com/reuters/topNews"];
const RSS_API="https://api.rss2json.com/v1/api.json?rss_url=";
const TR_API="https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=bn&dt=t&q=";
let allNews=[];
document.getElementById('pDate').innerText=new Date().toLocaleDateString('bn-BD',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

async function toBn(t){try{let r=await fetch(TR_API+encodeURIComponent(t.slice(0,2000)));let d=await r.json();return d[0].map(x=>x[0]).join('');}catch{return t;}}
function clean(s){let d=document.createElement('div');d.innerHTML=s;return d.textContent.trim();}
function makeReport(tt,ss){return `<h1 class="text-3xl font-black leading-tight mb-3">${tt}</h1><p class="text-xs text-gray-500 mb-6">${new Date().toLocaleString('bn-BD')} | নিজস্ব প্রতিবেদক</p><p class="mb-4 text-lg leading-8 text-justify">${ss}।</p><p class="mb-4 leading-8 text-justify">সর্বশেষ প্রাপ্ত তথ্য অনুযায়ী, এ ঘটনাটি আন্তর্জাতিক মহলে ব্যাপক আলোচনার সৃষ্টি করেছে। সংশ্লিষ্ট কর্তৃপক্ষ জানিয়েছে, পরিস্থিতি নিবিড়ভাবে পর্যবেক্ষণ করা হচ্ছে এবং প্রয়োজনীয় ব্যবস্থা নেওয়া হচ্ছে।</p><p class="mb-4 leading-8 text-justify">বিশ্লেষকরা মনে করছেন, এই ঘটনার প্রভাব দীর্ঘমেয়াদে পড়তে পারে। এ বিষয়ে নতুন কোনো তথ্য পাওয়া গেলে ডিওপি নিউজ ২৪ তা সাথে সাথে জানিয়ে দেবে।</p>`;}

async function loadNews(){
 try{
  let merged=[];for(let f of FEEDS){try{let r=await fetch(RSS_API+encodeURIComponent(f));let j=await r.json();if(j.items)merged=merged.concat(j.items);}catch{}}
  merged.sort((a,b)=>new Date(b.pubDate)-new Date(a.pubDate));
  let out=[];for(let i=0;i<Math.min(merged.length,18);i++){let it=merged[i];let bnT=await toBn(clean(it.title));let bnD=await toBn(clean(it.description).slice(0,150));out.push({titleBn:bnT,descBn:bnD,img:it.enclosure?.link||`https://picsum.photos/seed/${Date.now()+i}/800/500`,report:makeReport(bnT,bnD)});}
  allNews=out;
  // ticker
  document.getElementById('ticker').innerText=out.map(n=>n.titleBn).join(' ••• ');
  // lead
  let lead=out[0];
  document.getElementById('leadSection').innerHTML=`<div class="grid md:grid-cols-12 gap-6"><div class="md:col-span-8"><img src="${lead.img}" class="w-full h-[420px] object-cover"><h2 onclick="openM(0)" class="text-4xl font-black leading-tight mt-4 cursor-pointer hover:text-red-600">${lead.titleBn}</h2><p class="text-gray-600 mt-3 text-lg">${lead.descBn}</p></div><div class="md:col-span-4 space-y-6">${out.slice(1,5).map((x,i)=>`<div onclick="openM(${i+1})" class="flex gap-3 cursor-pointer border-b pb-4"><img src="${x.img}" class="w-24 h-20 object-cover"><h3 class="font-bold leading-snug">${x.titleBn}</h3></div>`).join('')}</div></div>`;
  // grid
  document.getElementById('gridSection').innerHTML=out.slice(5).map((x,i)=>`<div onclick="openM(${i+5})" class="cursor-pointer"><img src="${x.img}" class="w-full h-48 object-cover"><h3 class="font-bold mt-3 text-lg leading-snug">${x.titleBn}</h3><p class="text-sm text-gray-600 mt-2 line-clamp-2">${x.descBn}</p></div>`).join('');
  document.getElementById('loading').classList.add('hidden');
 }catch(e){document.getElementById('error').innerText=e.message;document.getElementById('error').classList.remove('hidden');}
}
function openM(i){let n=allNews[i];document.getElementById('mBody').innerHTML=`<img src="${n.img}" class="w-full h-96 object-cover mb-6">${n.report}`;document.getElementById('modal').classList.remove('hidden');}
loadNews();
setInterval(loadNews,10*60*1000);
</script>
</body>
</html>
