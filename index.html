<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOP News 24</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Serif Bengali',serif}</style>
</head>
<body class="bg-white">
<div class="text-center py-6 border-b-4 border-[#c00]">
<h1 class="text-5xl font-black"><span class="text-black">DOP</span><span class="text-[#c00]">News 24</span></h1>
<p class="text-[11px] tracking-[0.4em] mt-2 font-bold">SOTTER SATHE SOB SOMOY</p>
<div class="mt-3 flex justify-center gap-2 text-[12px]">
<button onclick="loadFeed('bd')" id="b-bd" class="px-4 py-1.5 bg-[#c00] text-white rounded-full">বাংলাদেশ</button>
<button onclick="loadFeed('world')" id="b-world" class="px-4 py-1.5 bg-gray-100 rounded-full">বিশ্ব</button>
<button onclick="loadFeed('sports')" id="b-sports" class="px-4 py-1.5 bg-gray-100 rounded-full">খেলা</button>
<button onclick="loadFeed('tech')" id="b-tech" class="px-4 py-1.5 bg-gray-100 rounded-full">প্রযুক্তি</button>
</div>
</div>
<div class="bg-[#c00] text-white py-2"><marquee id="ticker">লোড হচ্ছে...</marquee></div>
<main class="max-w-[1280px] mx-auto px-4 py-6"><div id="lead" class="grid md:grid-cols-12 gap-6"></div><div id="grid" class="grid md:grid-cols-3 gap-6 mt-8 border-t pt-6"></div></main>

<div id="modal" class="hidden fixed inset-0 z-[999] bg-black/80 p-4 overflow-y-auto">
<div class="max-w-3xl mx-auto bg-white min-h-screen rounded-lg">
<div class="flex justify-between items-center p-4 border-b sticky top-0 bg-white"><b>DOP News 24</b><button onclick="closeM()" class="bg-black text-white px-4 py-1 rounded-full">X</button></div>
<div id="mBody" class="p-6"></div>
</div>
</div>

<script>
var allNews=[];
var FEEDS={
bd: 'https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss?hl=bn%26gl=BD%26ceid=BD:bn',
world: 'https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss?hl=bn%26gl=BD%26ceid=BD:bn%26topic=w',
sports: 'https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss?hl=bn%26gl=BD%26ceid=BD:bn%26topic=s',
tech: 'https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss?hl=bn%26gl=BD%26ceid=BD:bn%26topic=t'
};
function setActive(id){['b-bd','b-world','b-sports','b-tech'].forEach(function(x){document.getElementById(x).className='px-4 py-1.5 bg-gray-100 rounded-full';});document.getElementById(id).className='px-4 py-1.5 bg-[#c00] text-white rounded-full';}
function cleanTitle(t){return t.replace(/\s*-\s*[^-]+$/,'').trim();}
async function loadFeed(cat){
setActive('b-'+cat);
document.getElementById('lead').innerHTML='<p class="col-span-12 text-center py-20">লোড হচ্ছে...</p>';
var r=await fetch(FEEDS[cat]); var j=await r.json();
var items=j.items.slice(0,15).map(function(it){
var img='https://picsum.photos/seed/'+Math.floor(Math.random()*99999)+'/800/500';
if(it.enclosure && it.enclosure.link) img=it.enclosure.link;
return {title: cleanTitle(it.title), link: it.link, img: img};
});
allNews=items;
document.getElementById('ticker').innerText=items.map(function(x){return x.title;}).join(' • ');
var a=items[0];
var html='<div class="md:col-span-8 cursor-pointer" onclick="openM(0)"><img src="'+a.img+'" class="w-full h-[420px] object-cover rounded"><h2 class="text-[30px] font-black mt-4 hover:text-red-600">'+a.title+'</h2></div>';
html+='<div class="md:col-span-4">';
for(var i=1;i<5;i++){var n=items[i]; html+='<div onclick="openM('+i+')" class="flex gap-3 border-b pb-4 mb-4 cursor-pointer"><img src="'+n.img+'" class="w-24 h-20 object-cover rounded"><h3 class="font-bold text-[15px]">'+n.title+'</h3></div>';}
html+='</div>';
document.getElementById('lead').innerHTML=html;
var ghtml='';
for(var k=5;k<items.length;k++){var g=items[k]; ghtml+='<div onclick="openM('+k+')" class="cursor-pointer"><img src="'+g.img+'" class="w-full h-48 object-cover rounded"><h3 class="font-bold mt-2 text-[17px]">'+g.title+'</h3></div>';}
document.getElementById('grid').innerHTML=ghtml;
}

async function openM(i){
var n=allNews[i]; var body=document.getElementById('mBody');
body.innerHTML='<img src="'+n.img+'" class="w-full h-[380px] object-cover rounded mb-5"><h1 class="text-3xl font-black mb-4">'+n.title+'</h1><p class="text-gray-500">খবর লোড হচ্ছে, অপেক্ষা করুন...</p>';
document.getElementById('modal').classList.remove('hidden'); document.body.style.overflow='hidden';

try{
// মূল সাইট থেকে খবর টানা
var proxy='https://api.allorigins.win/raw?url='+encodeURIComponent(n.link);
var res=await fetch(proxy); var html=await res.text();
var doc=new DOMParser().parseFromString(html,'text/html');
// সব <p> ট্যাগ থেকে লেখা নাও
var paras=Array.from(doc.querySelectorAll('p')).map(function(p){return p.textContent.trim();}).filter(function(t){return t.length>40;}).slice(0,8);
var content = paras.length>0? paras.join('<br><br>') : 'এই খবরের বিস্তারিত পড়তে নিচের বাটনে ক্লিক করুন।';
body.innerHTML='<img src="'+n.img+'" class="w-full h-[380px] object-cover rounded mb-5"><h1 class="text-3xl font-black mb-3 leading-tight">'+n.title+'</h1><p class="text-xs text-gray-400 mb-6">DOP News 24</p><div class="text-[18px] leading-8 text-justify">'+content+'</div><div class="mt-8 text-center"><a href="'+n.link+'" target="_blank" class="bg-[#c00] text-white px-8 py-3 rounded-full font-bold inline-block">মূল সাইটে বিস্তারিত পড়ুন →</a><p class="text-[11px] text-gray-400 mt-3">সূত্র: মূল সংবাদপত্র</p></div>';
}catch(e){
body.innerHTML+='<div class="mt-6 text-center"><a href="'+n.link+'" target="_blank" class="bg-[#c00] text-white px-8 py-3 rounded-full font-bold inline-block">মূল সাইটে বিস্তারিত পড়ুন →</a></div>';
}
}
function closeM(){document.getElementById('modal').classList.add('hidden');document.body.style.overflow='auto';}
loadFeed('bd');
</script>
</body>
</html>
