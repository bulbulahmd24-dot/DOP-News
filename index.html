<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOP News 24</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Serif Bengali',serif}</style>
</head>
<body class="bg-white">
<div class="border-b text-[11px] py-2 text-center">DOP News 24 | Dhaka | <span id="pDate"></span></div>

<!-- ENGLISH LOGO - NO IMAGE NEEDED -->
<div class="text-center py-6 border-b">
  <h1 class="text-6xl font-black tracking-tight" style="font-family:serif">
    <span class="text-black">DOP</span><span class="text-[#cc0000]"> News 24</span>
  </h1>
  <p class="text-[10px] tracking-[0.5em] mt-1">24/7 • ACCURATE • RELIABLE</p>
</div>

<div class="sticky top-0 z-40 bg-white border-y"><div class="max-w-[1280px] mx-auto px-4 flex gap-5 py-2.5 text-[13px] font-bold"><span class="text-red-600">World</span><span>National</span><span>Politics</span><span>Sports</span></div></div>
<div class="bg-red-600 text-white text-[12px] py-1.5 px-4" id="ticker">Loading news...</div>

<main class="max-w-[1280px] mx-auto px-4 py-6">
 <div id="loading" class="py-20 text-center font-bold">Loading... 10 sec wait</div>
 <div id="leadSection"></div>
 <div id="gridSection" class="grid md:grid-cols-3 gap-6 mt-8 border-t pt-6"></div>
</main>

<div id="modal" class="hidden fixed inset-0 z-50 bg-black/80 p-4 overflow-y-auto"><div class="max-w-2xl mx-auto bg-white p-6"><button onclick="document.getElementById('modal').classList.add('hidden')" class="float-right text-2xl">×</button><div id="mBody"></div></div></div>

<script>
const RSS="https://api.rss2json.com/v1/api.json?rss_url=https://feeds.bbci.co.uk/news/world/rss.xml";
const TR="https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=bn&dt=t&q=";
let all=[];
document.getElementById('pDate').innerText=new Date().toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'});
async function toBn(t){try{let r=await fetch(TR+encodeURIComponent(t.slice(0,1200)));let d=await r.json();return d[0].map(x=>x[0]).join('')}catch{return t}}
async function load(){
 try{
  let r=await fetch(RSS); let j=await r.json();
  let out=[]; for(let i=0;i<8;i++){let it=j.items[i]; let bn=await toBn(it.title); out.push({t:bn,d:it.description.slice(0,120),img:it.enclosure?.link||`https://picsum.photos/seed/${i}/600/400`})}
  all=out;
  document.getElementById('ticker').innerText=out.map(x=>x.t).join(' • ');
  document.getElementById('leadSection').innerHTML=`<div class="grid md:grid-cols-3 gap-6"><div class="md:col-span-2"><img src="${out[0].img}" class="w-full h-[350px] object-cover"><h2 onclick="openM(0)" class="text-3xl font-black mt-3 cursor-pointer">${out[0].t}</h2></div><div class="space-y-4">${out.slice(1,4).map((x,i)=>`<div onclick="openM(${i+1})" class="flex gap-3 border-b pb-3 cursor-pointer"><img src="${x.img}" class="w-20 h-16 object-cover"><b class="text-sm">${x.t}</b></div>`).join('')}</div></div>`;
  document.getElementById('gridSection').innerHTML=out.slice(4).map((x,i)=>`<div onclick="openM(${i+4})" class="cursor-pointer"><img src="${x.img}" class="w-full h-40 object-cover"><b class="mt-2 block text-sm">${x.t}</b></div>`).join('');
  document.getElementById('loading').style.display='none';
 }catch(e){document.getElementById('loading').innerText='Error: '+e.message+' - Refresh করুন';}
}
function openM(i){document.getElementById('mBody').innerHTML=`<img src="${all[i].img}" class="w-full h-64 object-cover mb-4"><h1 class="text-2xl font-black mb-3">${all[i].t}</h1><p>${all[i].d}</p>`;document.getElementById('modal').classList.remove('hidden')}
load();
setInterval(load,10*60*1000);
</script>
</body>
</html>
