<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOP news - Daily Online Press</title>
<style>
body{font-family:sans-serif; margin:0; background:#f5f5f5}
header{background:#b71c1c; color:white; padding:15px; text-align:center; font-size:24px; font-weight:bold}
.container{max-width:800px; margin:auto; padding:20px}
.card{background:white; padding:15px; margin-bottom:15px; border-radius:8px; box-shadow:0 2px 5px #0001}
h2{margin:0 0 10px}
</style>
</head>
<body>
<header>DOP news</header>
<div class="container" id="news-list">
<div class="card">লোড হচ্ছে...</div>
</div>
<script>
const SUPABASE_URL = "https://kosmgaxmnsnbzvjlsroi.supabase.co";
const SUPABASE_KEY = "sb_publishable_PASTE_YOUR_KEY_HERE";

async function loadNews(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/news?select=*&order=created_at.desc`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  const data = await res.json();
  const list = document.getElementById('news-list');
  if(!data.length){ list.innerHTML = '<div class=card>এখনো কোনো নিউজ নেই। Supabase এ নিউজ যোগ করুন।</div>'; return; }
  list.innerHTML = data.map(n => `<div class=card><h2>${n.title}</h2><p>${n.content || ''}</p></div>`).join('');
}
loadNews();
</script>
</body>
</html>
