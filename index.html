<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ডিওপি নিউজ ২৪ - সত্যের সাথে সব সময়</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@700;900&family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Noto Sans Bengali','Noto Serif Bengali',serif}
h1,h2,h3{font-family:'Noto Serif Bengali',serif}
.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body class="bg-[#fffcf7]">
<!-- Header 100% Bangla -->
<div class="text-center py-6 border-b-4 border-[#c00] bg-white">
  <h1 class="text-5xl font-black tracking-tight"><span class="text-black">ডিওপি</span><span class="text-[#c00]">নিউজ</span><span class="text-black">২৪</span></h1>
  <p class="text-[13px] tracking-[0.3em] mt-2 font-bold text-gray-700">সত্যের সাথে সব সময়</p>
  <div class="mt-4 flex justify-center gap-2 text-[13px] flex-wrap">
    <button onclick="loadFeed('bd')" id="b-bd" class="px-4 py-1.5 bg-[#c00] text-white rounded-full font-bold">বাংলাদেশ</button>
    <button onclick="loadFeed('world')" id="b-world" class="px-4 py-1.5 bg-gray-100 rounded-full">বিশ্ব</button>
    <button onclick="loadFeed('sports')" id="b-sports" class="px-4 py-1.5 bg-gray-100 rounded-full">খেলা</button>
    <button onclick="loadFeed('tech')" id="b-tech" class="px-4 py-1.5 bg-gray-100 rounded-full">প্রযুক্তি</button>
  </div>
</div>

<div class="bg-[#c00] text-white py-2.5"><div class="max-w-[1280px] mx-auto px-4"><marquee id="ticker" class="text-[14px]">সংবাদ লোড হচ্ছে...</marquee></div></div>

<main class="max-w-[1280px] mx-auto px-4 py-6 bg-white mt-4 shadow-sm">
  <div id="lead" class="grid md:grid-cols-12 gap-6"></div>
  <div id="grid" class="grid md:grid-cols-3 gap-6 mt-8 border-t pt-6"></div>
  <p id="time" class="text-center text-xs text-gray-400 mt-10"></p>
</main>

<!-- Modal -->
<div id="modal" class="hidden fixed inset-0 z-[999] bg-black/80 p-4 overflow-y-auto">
  <div class="max-w-3xl mx-auto bg-white min-h-screen rounded-lg overflow-hidden">
    <div class="flex justify-between items-center p-4 border-b sticky top-0 bg-white">
      <b>ডিওপি নিউজ ২৪</b><button onclick="closeM()" class="bg-black text-white px-5 py-1.5 rounded-full text-sm">✕ বন্ধ করুন</button>
    </div>
    <div id="mBody" class="p-6"></div>
  </div>
</div>

<script>
var allNews=[];
var FEEDS={
bd: 'https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss?hl=bn%26gl=BD%26ceid=BD:bn',
world: 'https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss?hl=bn%26gl=BD%26ceid=BD:bn%26topic=w',
sports: 'https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss?hl=bn%26gl=BD%26ceid=BD:bn%26topic=s',
tech: 'https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss?hl=bn%26gl=BD%26ceid=BD:bn%26topic=t'
};

function setActive(id){
['b-bd','b-world','b-sports','b-tech'].forEach(function(x){document.getElementById(x).className='px-4 py-1.5 bg-gray-100 rounded-full';});
document.getElementById(id).className='px-4 py-1.5 bg-[#c00] text-white rounded-full font-bold';
}

function cleanDesc(html){
// সব লিংক, সোর্স রেফারেন্স বাদ দাও
var d=document.createElement('div'); d.innerHTML=html;
d.querySelectorAll('a, font, img').forEach(function(e){e.remove();});
var text = d.textContent || d.innerText || "";
return text.substring(0,700).trim();
}

async function loadFeed(cat){
setActive('b-'+cat);
document.getElementById('lead').innerHTML='<p class="col-span-12 text-center py-20 text-gray-500">সংবাদ আনা হচ্ছে...</p>';
try{
var url=FEEDS[cat];
var r=await fetch(url); var j=await r.json();
var items=j.items.slice(0,15).map(function(it){
var img='https://picsum.photos/seed/'+Math.floor(Math.random()*10000)+'/800/500';
if(it.enclosure && it.enclosure.link) img=it.enclosure.link;
return {title: it.title, desc: cleanDesc(it.description), fullDesc: it.description, link: it.link, img: img, pubDate: it.pubDate};
});
allNews=items;
document.getElementById('ticker').innerText = items.map(function(x){return x.title;}).join(' ● ');
var a=items[0];
var leadHtml='<div class="md:col-span-8 cursor-pointer group" onclick="openM(0)"><img src="'+a.img+'" class="w-full h-[420px] object-cover rounded"><h2 class="text-[30px] font-black leading-tight mt-4 group-hover:text-[#c00]">'+a.title+'</h2><p class="text-[14px] text-gray-600 mt-2 line-clamp-2">'+a.desc+'</p></div>';
leadHtml+='<div class="md:col-span-4">';
for(var i=1;i<5;i++){var n=items[i]; leadHtml+='<div onclick="openM('+i+')" class="flex gap-3 border-b pb-4 mb-4 cursor-pointer group"><img src="'+n.img+'" class="w-24 h-20 object-cover rounded"><h3 class="font-bold text-[15px] leading-tight group-hover:text-[#c00]">'+n.title+'</h3></div>';}
leadHtml+='</div>';
document.getElementById('lead').innerHTML=leadHtml;
var gridHtml='';
for(var k=5;k<items.length;k++){var g=items[k]; gridHtml+='<div onclick="openM('+k+')" class="cursor-pointer group"><img src="'+g.img+'" class="w-full h-48 object-cover rounded"><h3 class="font-bold mt-3 text-[17px] leading-tight group-hover:text-[#c00]">'+g.title+'</h3><p class="text-[13px] text-gray-500 mt-1">'+g.desc.substring(0,80)+'...</p></div>';}
document.getElementById('grid').innerHTML=gridHtml;
document.getElementById('time').innerText='সর্বশেষ আপডেট: '+new Date().toLocaleString('bn-BD');
}catch(e){
document.getElementById('lead').innerHTML='<div class="col-span-12 text-center py-10"><button onclick="loadFeed(\''+cat+'\')" class="bg-[#c00] text-white px-6 py-2 rounded">আবার চেষ্টা করুন</button></div>';
}
}

function openM(i){
var n=allNews[i]; if(!n) return;
var body=document.getElementById('mBody'); body.innerHTML='';
var img=document.createElement('img'); img.src=n.img; img.className='w-full h-[380px] object-cover rounded mb-5'; body.appendChild(img);
var h1=document.createElement('h1'); h1.className='text-[30px] font-black leading-tight mb-3'; h1.textContent=n.title; body.appendChild(h1);
var p=document.createElement('p'); p.className='text-xs text-gray-400 mb-5'; p.textContent='ডিওপি নিউজ ২৪ | '+n.pubDate; body.appendChild(p);
var d=document.createElement('div'); d.className='text-[18px] leading-9 text-gray-800'; d.textContent=n.desc; body.appendChild(d);
var note=document.createElement('p'); note.className='mt-8 text-[12px] text-gray-400 border-t pt-4'; note.textContent='এই সংবাদটি স্বয়ংক্রিয়ভাবে সংগ্রহ করা হয়েছে। বিস্তারিত জানতে মূল উৎস দেখুন।'; body.appendChild(note);
document.getElementById('modal').classList.remove('hidden'); document.body.style.overflow='hidden';
}
function closeM(){document.getElementById('modal').classList.add('hidden');document.body.style.overflow='auto';}
loadFeed('bd');
</script>
</body>
</html>
