<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOP News 24</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Serif Bengali',serif}</style>
</head>
<body class="bg-white">
<div class="text-center py-6 border-b">
<h1 class="text-5xl font-black"><span class="text-black">DOP</span><span class="text-[#c00]">News 24</span></h1>
<p class="text-[11px] tracking-[0.4em] mt-2 font-bold">WORLD NEWS | SOTTER SATHE SOB SOMOY</p>
<div class="mt-3 flex justify-center gap-2 text-[11px] flex-wrap">
<button onclick="loadFeed('bd')" id="b-bd" class="px-3 py-1 bg-black text-white rounded">Bangladesh</button>
<button onclick="loadFeed('world')" id="b-world" class="px-3 py-1 bg-gray-200 rounded">World</button>
<button onclick="loadFeed('sports')" id="b-sports" class="px-3 py-1 bg-gray-200 rounded">Sports</button>
<button onclick="loadFeed('tech')" id="b-tech" class="px-3 py-1 bg-gray-200 rounded">Tech</button>
</div>
</div>
<div class="bg-[#c00] text-white py-2"><div class="max-w-[1280px] mx-auto px-4"><marquee id="ticker">Loading world news...</marquee></div></div>
<main class="max-w-[1280px] mx-auto px-4 py-6">
<div id="lead" class="grid md:grid-cols-12 gap-6"></div>
<div id="grid" class="grid md:grid-cols-3 gap-6 mt-8 border-t pt-6"></div>
<p id="time" class="text-center text-xs text-gray-400 mt-10"></p>
</main>
<div id="modal" class="hidden fixed inset-0 z-[999] bg-black/80 p-4 overflow-y-auto">
<div class="max-w-3xl mx-auto bg-white min-h-screen">
<div class="flex justify-between items-center p-4 border-b sticky top-0 bg-white"><b>DOP News 24</b><button onclick="closeM()" class="bg-black text-white px-4 py-1 rounded">X</button></div>
<div id="mBody" class="p-6"></div>
</div>
</div>
<script>
var allNews=[];
var FEEDS={
bd: 'https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss?hl=bn%26gl=BD%26ceid=BD:bn',
world: 'https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss?hl=en-US%26gl=US%26ceid=US:en',
sports: 'https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss/headlines/section/topic/Sports?hl=en-US%26gl=US%26ceid=US:en',
tech: 'https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss/headlines/section/topic/Technology?hl=en-US%26gl=US%26ceid=US:en'
};
function setActive(id){
document.getElementById('b-bd').className='px-3 py-1 bg-gray-200 rounded';
document.getElementById('b-world').className='px-3 py-1 bg-gray-200 rounded';
document.getElementById('b-sports').className='px-3 py-1 bg-gray-200 rounded';
document.getElementById('b-tech').className='px-3 py-1 bg-gray-200 rounded';
document.getElementById(id).className='px-3 py-1 bg-black text-white rounded';
}
async function loadFeed(cat){
setActive('b-'+cat);
document.getElementById('lead').innerHTML='<p class="col-span-12 text-center py-20">Loading from Google News...</p>';
try{
var url = FEEDS[cat];
var r = await fetch(url);
var j = await r.json();
var items = j.items.slice(0,15).map(function(it){
var img = it.enclosure && it.enclosure.link ? it.enclosure.link : 'https://picsum.photos/seed/'+Math.floor(Math.random()*10000)+'/800/500';
return {title: it.title, desc: it.description, link: it.link, img: img, pubDate: it.pubDate, source: 'Google News'};
});
allNews = items;
document.getElementById('ticker').innerText = items.map(function(x){return x.title;}).join(' *** ');
var a = items[0];
var leadHtml = '<div class="md:col-span-8 cursor-pointer" onclick="openM(0)"><img src="'+a.img+'" class="w-full h-[420px] object-cover"><h2 class="text-[30px] font-black leading-tight mt-4">'+a.title+'</h2><p class="text-xs text-gray-500 mt-1">'+a.pubDate+'</p></div>';
leadHtml += '<div class="md:col-span-4">';
for(var i=1;i<5;i++){var n=items[i]; leadHtml+='<div onclick="openM('+i+')" class="flex gap-3 border-b pb-4 mb-4 cursor-pointer"><img src="'+n.img+'" class="w-24 h-20 object-cover"><h3 class="font-bold text-[15px]">'+n.title+'</h3></div>';}
leadHtml+='</div>';
document.getElementById('lead').innerHTML = leadHtml;
var gridHtml='';
for(var k=5;k<items.length;k++){var g=items[k]; gridHtml+='<div onclick="openM('+k+')" class="cursor-pointer"><img src="'+g.img+'" class="w-full h-48 object-cover"><h3 class="font-black mt-2 text-[17px]">'+g.title+'</h3></div>';}
document.getElementById('grid').innerHTML=gridHtml;
document.getElementById('time').innerText='Source: Google News, BBC, CNN, Reuters | Updated: '+new Date().toLocaleString('bn-BD');
}catch(e){
document.getElementById('lead').innerHTML='<div class="col-span-12 text-center py-10">Load failed. <button onclick="loadFeed(\''+cat+'\')" class="bg-red-600 text-white px-4 py-1 rounded">Retry</button></div>';
}
}
function openM(i){
var n=allNews[i]; if(!n) return;
var body=document.getElementById('mBody');
body.innerHTML='';
var img=document.createElement('img'); img.src=n.img; img.className='w-full h-[350px] object-cover mb-4'; body.appendChild(img);
var h1=document.createElement('h1'); h1.className='text-3xl font-black mb-3'; h1.textContent=n.title; body.appendChild(h1);
var p=document.createElement('p'); p.className='text-xs text-gray-500 mb-4'; p.textContent=n.pubDate; body.appendChild(p);
var d=document.createElement('div'); d.className='text-[18px] leading-8'; d.innerHTML=n.desc; body.appendChild(d);
var a=document.createElement('a'); a.href=n.link; a.target='_blank'; a.className='bg-red-600 text-white px-6 py-2 inline-block mt-6 font-bold'; a.textContent='Read Original Source ->'; body.appendChild(a);
document.getElementById('modal').classList.remove('hidden');
document.body.style.overflow='hidden';
}
function closeM(){document.getElementById('modal').classList.add('hidden');document.body.style.overflow='auto';}
loadFeed('bd');
</script>
</body>
</html>
