<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOP News 24 - সত্যের সাথে সবসময়</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Serif Bengali',serif}</style>
</head>
<body class="bg-white">

<!-- ENGLISH LOGO - 100% Text, no image -->
<div class="text-center py-6 border-b">
  <h1 class="text-6xl font-black tracking-tighter" style="font-family:serif">
    <span style="color:#000">DOP</span><span style="color:#cc0000">News 24</span>
  </h1>
  <p class="text-[11px] tracking-[0.4em] mt-2 font-bold text-gray-600">SOTTER SATHE SOB SOMOY</p>
</div>

<div class="bg-white border-b sticky top-0 z-40">
  <div class="max-w-[1280px] mx-auto px-4 flex gap-6 py-3 text-[14px] font-bold">
    <span class="text-red-600 border-b-2 border-red-600">সর্বশেষ</span><span>জাতীয়</span><span>বিশ্ব</span><span>খেলা</span><span>বিনোদন</span>
  </div>
</div>

<div class="bg-[#cc0000] text-white py-2">
  <div class="max-w-[1280px] mx-auto px-4 flex">
    <span class="bg-black px-3 py-1 text-xs font-bold mr-3">ব্রেকিং</span>
    <marquee id="ticker" class="flex-1">সংবাদ লোড হচ্ছে...</marquee>
  </div>
</div>

<main class="max-w-[1280px] mx-auto px-4 py-6">
  <div id="lead" class="grid md:grid-cols-12 gap-6"></div>
  <div id="grid" class="grid md:grid-cols-3 gap-6 mt-8 border-t pt-6"></div>
  <p id="time" class="text-center text-xs text-gray-400 mt-10"></p>
</main>

<script>
const SAMPLE = [
 {title:"অন্তর্বর্তী সরকারের নতুন সিদ্ধান্তে স্বস্তি",desc:"দেশের সার্বিক পরিস্থিতি নিয়ে..."},
 {title:"ঢাকায় আজ বৃষ্টির সম্ভাবনা, তাপমাত্রা কমবে",desc:"আবহাওয়া অধিদপ্তর জানিয়েছে..."},
 {title:"বিশ্বকাপ বাছাইয়ে বাংলাদেশের জয়",desc:"মিরপুরে অনুষ্ঠিত ম্যাচে..."},
 {title:"বাজারে কমেছে সবজির দাম",desc:"কারওয়ান বাজারে আজ..."},
 {title:"পদ্মা সেতুতে নতুন রেকর্ড",desc:"গত ২৪ ঘণ্টায়..."},
 {title:"শিক্ষা প্রতিষ্ঠান খোলা নিয়ে নতুন নির্দেশনা",desc:"শিক্ষা মন্ত্রণালয় থেকে..."}
];

async function load(){
  let news = [];
  let apis = [
    `https://api.allorigins.win/raw?url=${encodeURIComponent('https://www.jagonews24.com/rss/rss.xml')}?t=${Date.now()}`,
    `https://corsproxy.io/?${encodeURIComponent('https://www.jagonews24.com/rss/rss.xml')}`
  ];

  for(let api of apis){
    try{
      let r = await fetch(api);
      let text = await r.text();
      let doc = new DOMParser().parseFromString(text,"text/xml");
      let items = Array.from(doc.querySelectorAll("item")).slice(0,12);
      if(items.length>0){
        news = items.map(i=>({title:i.querySelector("title")?.textContent||"", desc:i.querySelector("description")?.textContent?.replace(/<[^>]+>/g,'').slice(0,120)||"", link:i.querySelector("link")?.textContent||"#", img:`https://picsum.photos/seed/${Math.random()}/600/400`}));
        break;
      }
    }catch(e){}
  }

  if(news.length==0){
    // ফিড ফেইল হলেও সাইট ফাঁকা থাকবে না - ডেমো নিউজ দেখাবে
    news = SAMPLE.map(s=>({...s, link:"#", img:`https://picsum.photos/seed/${Math.random()}/600/400`}));
    document.getElementById('ticker').innerText = "লাইভ ফিড ব্যস্ত আছে - ডেমো সংবাদ দেখানো হচ্ছে ••• " + news.map(n=>n.title).join(' ••• ');
  }else{
    document.getElementById('ticker').innerText = news.map(n=>n.title).join(' ••• ');
  }

  document.getElementById('lead').innerHTML = `
    <div class="md:col-span-8">
      <img src="${news[0].img}" class="w-full h-[420px] object-cover bg-gray-100">
      <h2 class="text-[34px] font-black leading-tight mt-4 hover:text-red-600 cursor-pointer">${news[0].title}</h2>
      <p class="text-gray-600 mt-2">${news[0].desc}</p>
    </div>
    <div class="md:col-span-4 space-y-4">
      ${news.slice(1,5).map(n=>`<div class="flex gap-3 border-b pb-4"><img src="${n.img}" class="w-24 h-20 object-cover bg-gray-100"><h3 class="font-bold text-[16px] leading-snug">${n.title}</h3></div>`).join('')}
    </div>
  `;
  document.getElementById('grid').innerHTML = news.slice(5).map(n=>`<div><img src="${n.img}" class="w-full h-48 object-cover bg-gray-100"><h3 class="font-black mt-3 text-[18px] leading-snug">${n.title}</h3></div>`).join('');

  document.getElementById('time').innerText = "শেষ আপডেট: "+new Date().toLocaleTimeString('bn-BD')+" | প্রতি ১০ মিনিটে অটো আপডেট";
}

load();
setInterval(load, 10*60*1000); // 10 মিনিট পর পর নতুন নিউজ
</script>
</body>
</html>
