<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOP NEWS 24 - AI LIVE</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans">
<div class="bg-[#b91c1c] text-white text-center py-3 text-xl font-bold">DOP NEWS 24 - AI LIVE</div>
<div id="box" class="p-4 max-w-2xl mx-auto grid gap-4">লোড হচ্ছে...</div>
<script>
const URL = "এখানে আপনার Project URL পেস্ট করুন";
const KEY = "এখানে আপনার anon KEY পেস্ট করুন";
const client = supabase.createClient(URL, KEY);
async function load(){
 const {data} = await client.from('news').select('*').order('id',{ascending:false});
 document.getElementById('box').innerHTML = data.map(n=>`
  <div class="bg-white p-3 rounded-lg shadow">
   <img src="https://picsum.photos/seed/${n.id}/600/350" class="w-full h-48 object-cover rounded mb-2">
   <h2 class="font-bold text-lg">${n.title}</h2>
   <p class="text-sm text-gray-600 mt-1">${n.summary}</p>
   <span class="text-xs bg-red-100 text-red-600 px-2 py-1 rounded mt-2 inline-block">${n.category||'খবর'}</span>
  </div>`).join('');
}
load();
</script>
</body>
</html>
