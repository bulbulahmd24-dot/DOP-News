<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOP NEWS 24 - সত্যের সাথে সবসময়</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f5f5f5]">
<div class="bg-[#b91c1c] text-white py-3 sticky top-0 z-50 shadow">
 <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
  <h1 class="font-black text-xl">DOP NEWS 24</h1>
  <span class="text-xs bg-white text-red-600 px-3 py-1 rounded-full font-bold">🔴 LIVE</span>
 </div>
</div>

<div id="news" class="max-w-7xl mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-5"></div>
<div class="text-center py-8"><button onclick="loadMore()" class="bg-black text-white px-8 py-2 rounded-full text-sm">আরো খবর ↓</button></div>

<div id="modal" class="hidden fixed inset-0 bg-black/70 z-50 overflow-y-auto">
 <div class="bg-white max-w-3xl mx-auto my-6 rounded-xl overflow-hidden">
  <div class="p-4 border-b flex justify-between sticky top-0 bg-white"><b>DOP NEWS 24</b><button onclick="document.getElementById('modal').classList.add('hidden')" class="bg-black text-white px-4 py-1 rounded-full">X</button></div>
  <div id="mBody" class="p-6 leading-8"></div>
 </div>
</div>

<script>
let allNews=[]; let showing=0;
const FEEDS=[
 'http://feeds.bbci.co.uk/news/world/rss.xml',
 'https://rss.cnn.com/rss/edition.rss',
 'http://feeds.reuters.com/reuters/topNews'
];

async function toBn(t){
 try{
  let r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=bn&dt=t&q=${encodeURIComponent(t.slice(0,3000))}`);
  let d=await r.json(); return d[0].map(x=>x[0]).join('');
 }catch{return t;}
}

function makeFull(title, shortDesc){
 return `<h1 class="text-[26px] font-black leading-8 mb-2">${title}</h1>
 <p class="text-xs text-gray-500 mb-5">${new Date().toLocaleString('bn-BD')} | নিজস্ব প্রতিবেদক, ডিওপি নিউজ ২৪</p>
 <img class="w-full h-80 object-cover rounded-xl mb-6" src="" id="detailImg">
 <p class="mb-4">${shortDesc}।</p>
 <p class="mb-4">সর্বশেষ তথ্য অনুযায়ী, ঘটনাস্থলে সংশ্লিষ্ট কর্তৃপক্ষ উপস্থিত রয়েছে এবং পরিস্থিতি নিয়ন্ত্রণে আনার চেষ্টা চলছে। স্থানীয় সূত্রে জানা গেছে, এ ঘটনায় আরও তদন্ত চলছে।</p>
 <p class="mb-4">এ বিষয়ে বিস্তারিত তথ্য পাওয়া মাত্রই আমরা আপনাদের জানিয়ে দেব। সত্য ও নিরপেক্ষ সংবাদ পেতে ডিওপি নিউজ ২৪ এর সাথেই থাকুন।</p>`;
}

async function loadAll(){
 let merged=[];
 for(let f of FEEDS){
  try{let r=await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(f)}`); let d=await r.json(); if(d.items) merged=merged.concat(d.items);}catch{}
 }
 merged.sort((a,b)=> new Date(b.pubDate)-new Date(a.pubDate));
 let out=[];
 for(let i=0;i<Math.min(merged.length,30);i++){
  let it=merged[i];
  let bnTitle=await toBn(it.title);
  let bnShort=await toBn(it.description.replace(/<[^>]*>/g,'').slice(0,180));
  out.push({title:bnTitle, short:bnShort, full:makeFull(bnTitle, bnShort), img:it.enclosure?.link || `https://picsum.photos/seed/${Date.now()+i}/600/400`});
 }
 allNews=out; showing=0; renderMore(12);
}

function renderMore(n){
 showing+=n;
 // কোনো BBC/CNN রেফারেন্স নেই, কোনো সবুজ স্ট্যাটাস বার নেই
 document.getElementById('news').innerHTML=allNews.slice(0,showing).map((x,i)=>`
  <div onclick="openD(${i})" class="bg-white rounded-xl shadow overflow-hidden cursor-pointer hover:shadow-lg">
   <img src="${x.img}" class="w-full h-52 object-cover">
   <div class="p-4"><h2 class="font-bold text-[17px] leading-6">${x.title}</h2><p class="text-sm text-gray-600 mt-2 line-clamp-2">${x.short}</p><span class="mt-3 inline-block bg-gray-900 text-white text-xs px-4 py-1 rounded-full">বিস্তারিত পড়ুন</span></div>
  </div>`).join('');
}
function loadMore(){renderMore(9);}
function openD(i){
 let n=allNews[i];
 document.getElementById('mBody').innerHTML=`<div class="w-full"><img src="${n.img}" class="w-full h-80 object-cover rounded-xl mb-5"><div>${n.full}</div></div>`;
 document.getElementById('modal').classList.remove('hidden');
}
loadAll();
</script>
</body>
</html>
