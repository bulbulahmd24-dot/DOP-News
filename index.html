<script>
async function load(){
 try{
  let r=await fetch(RSS); let j=await r.json();
  let out=[];
  for(let i=0;i<12;i++){
    let it=j.items[i];
    let bn=await toBn(it.title); // ইংরেজি থেকে বাংলায় অনুবাদ
    out.push({
      t: bn, // বাংলা শিরোনাম
      d: await toBn(it.description.slice(0,100)),
      img:it.enclosure?.link||`https://picsum.photos/seed/${i}/600/400`
    })
  }
  // ticker বাংলায়
  document.getElementById('ticker').innerText=out.map(x=>x.t).join(' ••• ');

  // Lead - বাংলা হেডলাইন বড় করে
  document.getElementById('leadSection').innerHTML=`
    <div class="grid md:grid-cols-12 gap-6">
      <div class="md:col-span-8">
        <img src="${out[0].img}" class="w-full h-[420px] object-cover">
        <h2 class="text-[36px] font-black leading-[1.2] mt-4 hover:text-red-600 cursor-pointer" style="font-family:'Noto Serif Bengali'">${out[0].t}</h2>
        <p class="text-gray-600 mt-2 text-[15px]">${out[0].d}</p>
      </div>
      <div class="md:col-span-4 space-y-5">
        ${out.slice(1,5).map((x,i)=>`
          <div class="flex gap-3 border-b pb-4 cursor-pointer">
            <img src="${x.img}" class="w-24 h-20 object-cover">
            <h3 class="font-black text-[16px] leading-snug">${x.t}</h3>
          </div>`).join('')}
      </div>
    </div>`;

  // Grid - সব বাংলা হেডলাইন
  document.getElementById('gridSection').innerHTML=out.slice(5).map(x=>`
    <div class="cursor-pointer">
      <img src="${x.img}" class="w-full h-48 object-cover">
      <h3 class="font-black mt-3 text-[18px] leading-snug">${x.t}</h3>
    </div>`).join('');

  document.getElementById('loading').style.display='none';
 }catch(e){document.getElementById('loading').innerText='Loading...';}
}
</script>
