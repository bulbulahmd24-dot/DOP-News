<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOP News 24</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Serif Bengali',serif}.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}</style>
</head>
<body class="bg-white">
<!-- LOGO ENGLISH AGAIN -->
<div class="text-center py-6 border-b-4 border-[#c00] bg-white">
  <h1 class="text-5xl font-black tracking-tight"><span class="text-black">DOP</span><span class="text-[#c00]">News 24</span></h1>
  <p class="text-[11px] tracking-[0.4em] mt-2 font-bold">SOTTER SATHE SOB SOMOY</p>
  <div class="mt-4 flex justify-center gap-2 text-[12px]">
    <button onclick="loadFeed('bd')" id="b-bd" class="px-4 py-1.5 bg-[#c00] text-white rounded-full font-bold">বাংলাদেশ</button>
    <button onclick="loadFeed('world')" id="b-world" class="px-4 py-1.5 bg-gray-100 rounded-full">বিশ্ব</button>
    <button onclick="loadFeed('sports')" id="b-sports" class="px-4 py-1.5 bg-gray-100 rounded-full">খেলা</button>
    <button onclick="loadFeed('tech')" id="b-tech" class="px-4 py-1.5 bg-gray-100 rounded-full">প্রযুক্তি</button>
  </div>
</div>

<div class="bg-[#c00] text-white py-2"><div class="max-w-[1280px] mx-auto px-4"><marquee id="ticker">Loading...</marquee></div></div>

<main class="max-w-[1280px] mx-auto px-4 py-6">
  <div id="lead" class="grid md:grid-cols-12 gap-6"></div>
  <div id="grid" class="grid md:grid-cols-3 gap-6 mt-8 border-t pt-6"></div>
</main>

<div id="modal" class="hidden fixed inset-0 z-[999] bg-black/80 p-4 overflow-y-auto">
  <div class="max-w-3xl mx-auto bg-white min-h-screen">
    <div class="flex justify-between items-center p-4 border-b sticky top-0 bg-white"><b>DOP News 24</b><button onclick="closeM()" class="bg-black text-white px-4 py-1 rounded">X</button></div>
    <div id="mBody" class="p-6"></div>
  </div>
</div>

<script>
var allNews=[];
var FEEDS={
bd: 'https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss?hl=bn%26gl=BD%26ceid=BD:bn',
world: 'https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss?hl=bn%26gl=BD%26ceid=BD:bn%26topic=w',
sports: 'https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss?hl=bn%26gl=BD%26ceid=BD:bn%26topic=s',
tech: 'https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss?hl=bn%26gl=BD%26ceid=BD:bn%26topic=t'
};
function setActive(id){
['b-bd','b-world','b-sports','b-tech'].forEach(function(x){document.getElementById(x).className='px-4 py-1.5 bg-gray-100 rounded-full';});
document.getElementById(id).className='px-4 py-1.5 bg-[#c00] text-white rounded-full font-bold';
}
function cleanTitle(t){
// "- BBC", "- Anandabazar", "- Bangla Tribune" এই সব কেটে ফেলা
return t.replace(/\s*-\s*[^-]+$/,'').trim();
}
function cleanDesc(html){
var d=document.createElement('div'); d.innerHTML=html;
d.querySelectorAll('a').forEach(function(a){a.remove();});
var txt=d.textContent||"";
txt=txt.replace(/Anandabazar|BBC|Bangla Tribune|Banglanews24|bdnews24.*|Daily Star/gi,'').trim();
return txt.substring(0,500);
}
async function loadFeed(cat){
setActive('b-'+cat);
document.getElementById('lead').innerHTML='<p class="col-span-12 text-center py-20">লোড হচ্ছে...</p>';
try{
var r=await fetch(FEEDS[cat]); var j=await r.json();
var items=j.items.slice(0,15).map(function(it){
var img='https://picsum.photos/seed/'+Math.floor(Math.random()*9999)+'/800/500';
if(it.enclosure && it.enclosure.link && it.enclosure.link.startsWith('http')) img=it.enclosure.link;
return {title: cleanTitle(it.title), desc: cleanDesc(it.description), link: it.link, img: img};
});
allNews=items;
document.getElementById('ticker').innerText = items.map(function(x){return x.title;}).join(' • ');
var a=items[0];
var leadHtml='<div class="md:col-span-8 cursor-pointer" onclick="openM(0)"><img src="'+a.img+'" class="w-full h-[420px] object-cover"><h2 class="text-[32px] font-black leading-tight mt-4 hover:text-red-600">'+a.title+'</h2><p class="text-[15px] text-gray-600 mt-2">'+a.desc+'</p></div>';
leadHtml+='<div class="md:col-span-4">';
for(var i=1;i<5;i++){var n=items[i]; leadHtml+='<div onclick="openM('+i+')" class="flex gap-3 border-b pb-4 mb-4 cursor-pointer"><img src="'+n.img+'" class="w-24 h-20 object-cover"><h3 class="font-bold text-[15px] leading-tight">'+n.title+'</h3></div>';}
leadHtml+='</div>';
document.getElementById('lead').innerHTML=leadHtml;
var gridHtml='';
for(var k=5;k<items.length;k++){var g=items[k]; gridHtml+='<div onclick="openM('+k+')" class="cursor-pointer"><img src="'+g.img+'" class="w-full h-48 object-cover"><h3 class="font-black mt-2 text-[17px] leading-tight">'+g.title+'</h3></div>';}
document.getElementById('grid').innerHTML=gridHtml;
}catch(e){document.getElementById('lead').innerHTML='Load failed';}
}
function openM(i){
var n=allNews[i]; if(!n) return;
var body=document.getElementById('mBody'); body.innerHTML='';
var img=document.createElement('img'); img.src=n.img; img.className='w-full h-[350px] object-cover mb-4'; body.appendChild(img);
var h1=document.createElement('h1'); h1.className='text-3xl font-black mb-3'; h1.textContent=n.title; body.appendChild(h1);
var d=document.createElement('p'); d.className='text-[18px] leading-8'; d.textContent=n.desc; body.appendChild(d);
document.getElementById('modal').classList.remove('hidden'); document.body.style.overflow='hidden';
}
function closeM(){document.getElementById('modal').classList.add('hidden');document.body.style.overflow='auto';}
loadFeed('bd');
</script>
</body>
</html>
