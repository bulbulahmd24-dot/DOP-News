<!DOCTYPE html>
<html lang="bn">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - DOP News</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white p-6">
<h1 class="text-2xl font-bold mb-4">DOP NEWS - AI Admin Panel</h1>
<button id="btn" class="bg-red-600 px-6 py-3 rounded font-bold">🚀 আজকের ৫টা AI নিউজ অটো আনুন</button>
<div id="status" class="mt-4 text-yellow-300"></div>
<div id="log" class="mt-4"></div>
<script>
const supabaseUrl="https://kosmgaxmnsnbzvjlsroi.supabase.co";
const supabaseKey="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtvc21nYXhtbnNuYnp2amxzcm9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NTM3OTIsImV4cCI6MjEwNTIyOTc5Mn0.au_EMTL7mOTUFtihAa29dK7HTYt5et3lShje948lBNQ";
const client=supabase.createClient(supabaseUrl,supabaseKey);

document.getElementById('btn').onclick=async()=>{
  document.getElementById('status').innerText="নিউজ আনা হচ্ছে... অপেক্ষা করুন";
  try{
    const rss="https://api.rss2json.com/v1/api.json?rss_url=https://www.prothomalo.com/feed";
    const res=await fetch(rss);
    const data=await res.json();
    let count=0;
    for(let item of data.items.slice(0,5)){
      const news={title:item.title, content:item.description, category:"জাতীয়", image_url:item.enclosure?.link||"https://picsum.photos/400/200"};
      const {error}=await client.from('news').insert([news]);
      if(!error) count++;
    }
    document.getElementById('status').innerText="✅ সফল! "+count+" টা নিউজ ডাটাবেজে ঢুকেছে";
  }catch(e){ document.getElementById('status').innerText="Error: "+e.message; }
};
</script>
</body>
</html>
